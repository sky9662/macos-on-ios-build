name: Bounded ARM64 interpreter feasibility
on:
  push:
    branches: [main]
    paths:
      - 'interpreter/**'
      - '.github/workflows/interpreter.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tc-interpreter
  cancel-in-progress: false
jobs:
  portable:
    if: github.repository == 'sky9662/macos-on-ios-build' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded guest-data fixtures with sanitizers
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g interpreter/arm64_subset.c interpreter/test.c -o "$RUNNER_TEMP/interpreter-test"
          "$RUNNER_TEMP/interpreter-test"
  apple:
    if: github.repository == 'sky9662/macos-on-ios-build' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare interpreter with independently assembled native ARM64 fixtures
        run: |
          set -euxo pipefail
          test "$(uname -m)" = arm64
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -O2 -DTC_NATIVE_FIXTURE interpreter/arm64_subset.c interpreter/test.c interpreter/fixture.s -o "$RUNNER_TEMP/interpreter-test"
          "$RUNNER_TEMP/interpreter-test"
      - name: Compile for iOS without JIT or host callbacks
        run: |
          set -euxo pipefail
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -Wall -Wextra -Werror -c interpreter/arm64_subset.c -o "$RUNNER_TEMP/interpreter.o"
          xcrun lipo -verify_arch arm64 "$RUNNER_TEMP/interpreter.o"
          xcrun vtool -show-build "$RUNNER_TEMP/interpreter.o" | grep -i 'platform IOS'
          xcrun nm -u "$RUNNER_TEMP/interpreter.o" > "$RUNNER_TEMP/imports.txt"
          if grep -E 'mmap|mprotect|jit_write|mach_vm|dlopen|dlsym' "$RUNNER_TEMP/imports.txt"; then exit 1; fi
  vixl-reference:
    if: github.repository == 'sky9662/macos-on-ios-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install distribution-signed VIXL reference library
        run: |
          set -euxo pipefail
          sudo apt-get update
          candidate="$(apt-cache policy libvixl-dev | awk '/Candidate:/ {print $2}')"
          case "$candidate" in 5.1.0-*) ;; *) echo "Unexpected reference version: $candidate"; exit 1;; esac
          sudo apt-get install --no-install-recommends -y "libvixl-dev=$candidate" pkg-config
          dpkg-query -W libvixl-dev
          pkg-config --modversion vixl
          cat /usr/share/doc/libvixl-dev/copyright
      - name: Cross-check fixed synthetic instruction fixtures
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O2 -c interpreter/arm64_subset.c -o "$RUNNER_TEMP/tc-subset.o"
          c++ -std=c++17 -O2 -DVIXL_INCLUDE_SIMULATOR_AARCH64 $(pkg-config --cflags vixl) -I/usr/include/vixl interpreter/vixl_reference.cc "$RUNNER_TEMP/tc-subset.o" $(pkg-config --libs vixl) -o "$RUNNER_TEMP/tc-vixl-reference"
          timeout 30s "$RUNNER_TEMP/tc-vixl-reference"
  vixl-source:
    if: github.repository == 'sky9662/macos-on-ios-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact Ubuntu source via signed archive metadata
        run: |
          set -euxo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo sed 's/^Types: deb$/Types: deb-src/' /etc/apt/sources.list.d/ubuntu.sources | sudo tee /etc/apt/sources.list.d/tc-vixl-source.sources >/dev/null
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/vixl-download" "$RUNNER_TEMP/vixl-transfer"
          cd "$RUNNER_TEMP/vixl-download"
          apt-get source vixl=5.1.0-3
          test -d vixl-5.1.0/src
          test -f vixl-5.1.0/LICENCE
          sha256sum ./*.dsc ./*.tar.*
          tar -czf "$RUNNER_TEMP/vixl-transfer/vixl-source.tgz" -C vixl-5.1.0 src LICENCE
          cd "$RUNNER_TEMP/vixl-transfer"
          sha256sum vixl-source.tgz > vixl-source.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vixl-5.1.0-3-source-for-probe
          path: ${{ runner.temp }}/vixl-transfer/
          if-no-files-found: error
          retention-days: 1
  vixl-apple:
    needs: vixl-source
    if: github.repository == 'sky9662/macos-on-ios-build' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vixl-5.1.0-3-source-for-probe
          path: ${{ runner.temp }}/vixl-transfer
      - name: Build and link VIXL for macOS and iOS without executable code buffer allocation
        run: |
          set -euxo pipefail
          test "$(uname -m)" = arm64
          (cd "$RUNNER_TEMP/vixl-transfer" && shasum -a 256 -c vixl-source.tgz.sha256)
          mkdir -p "$RUNNER_TEMP/vixl-source"
          tar -xzf "$RUNNER_TEMP/vixl-transfer/vixl-source.tgz" -C "$RUNNER_TEMP/vixl-source"
          bash -n interpreter/build_vixl_apple.sh
          bash interpreter/build_vixl_apple.sh "$RUNNER_TEMP/vixl-source" "$RUNNER_TEMP/vixl-apple"
      - name: Package unsigned fixed-fixture iOS diagnostic
        run: |
          set -euxo pipefail
          bash -n interpreter/package_device_probe.sh
          bash interpreter/package_device_probe.sh "$RUNNER_TEMP/vixl-source" "$RUNNER_TEMP/vixl-apple" "$RUNNER_TEMP/vixl-device"
      - uses: actions/upload-artifact@v4
        with:
          name: tc-vixl-device-probe
          path: |
            ${{ runner.temp }}/vixl-device/tc-vixl-probe.ipa
            ${{ runner.temp }}/vixl-device/tc-vixl-probe.ipa.sha256
            ${{ runner.temp }}/vixl-device/imports.txt
          if-no-files-found: error
